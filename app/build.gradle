plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mulberrydiseaseclassifier'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mulberrydiseaseclassifier"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Gemini API Keys for smart rotation - set in gradle.properties
        buildConfigField "String", "GEMINI_API_KEY_1", "\"${project.findProperty('GEMINI_API_KEY_1') ?: ''}\""
        buildConfigField "String", "GEMINI_API_KEY_2", "\"${project.findProperty('GEMINI_API_KEY_2') ?: ''}\""
        buildConfigField "String", "GEMINI_API_KEY_3", "\"${project.findProperty('GEMINI_API_KEY_3') ?: ''}\""
        buildConfigField "String", "GEMINI_API_KEY_4", "\"${project.findProperty('GEMINI_API_KEY_4') ?: ''}\""
        buildConfigField "String", "GEMINI_API_KEY_5", "\"${project.findProperty('GEMINI_API_KEY_5') ?: ''}\""
        buildConfigField "String", "GEMINI_API_KEY_6", "\"${project.findProperty('GEMINI_API_KEY_6') ?: ''}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        mlModelBinding true
        buildConfig true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.tensorflow:tensorflow-lite-support:0.3.0'
    implementation 'org.tensorflow:tensorflow-lite-metadata:0.3.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.3.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu-delegate-plugin:0.3.0'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.karumi:dexter:6.2.2'

    // ExifInterface for image orientation correction
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    // OkHttp for Claude API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
}